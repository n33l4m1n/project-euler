# DevSecOps gates for every PR and every push to main (agents/agent-orchestration.md §5).
# The job name `gates` is the required status check in the main-protection ruleset.
name: gates

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: gates-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gates:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: No secret-shaped paths in the PR
        if: github.event_name == 'pull_request'
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          deny='(^|/)_snapshots/|\.(env|pem|key|p12|kdbx|tgz|jks|keystore)$|\.tar\.gz$|(^|/)id_(rsa|ed25519)'
          bad=$(git diff --name-only --diff-filter=ACR "$BASE...HEAD" | grep -E "$deny" || true)
          if [ -n "$bad" ]; then echo "::error::secret-shaped paths:"; echo "$bad"; exit 1; fi

      - name: gitleaks (pinned binary, sha256-checked)
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          curl -fsSLo "$RUNNER_TEMP/gl.tgz" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  $RUNNER_TEMP/gl.tgz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/gl.tgz" -C "$RUNNER_TEMP" gitleaks
          if [ "$EVENT" = pull_request ]; then
            "$RUNNER_TEMP/gitleaks" git --no-banner --redact --log-opts "$BASE..HEAD"
          else
            "$RUNNER_TEMP/gitleaks" git --no-banner --redact
          fi

      - name: Rust toolchain from rust-toolchain.toml
        run: rustup toolchain install

      - name: fmt, clippy, tests
        run: make check
