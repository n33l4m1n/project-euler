# Phase 1 of the agent loop (vault: agents/agent-orchestration.md).
# The owner labels an issue `agent:claude`; Claude implements it on an agent/* branch and the
# n33l4m1n-agent App opens the PR. The App token is the only GitHub credential the agent sees:
# one repo, one hour, contents + pull requests write. Merging stays with the owner.
name: implement-claude

on:
  issues:
    types: [labeled]

permissions:
  contents: read

concurrency:
  group: agent-implement-${{ github.repository }}
  cancel-in-progress: false

jobs:
  implement:
    if: >-
      github.event.label.name == 'agent:claude' &&
      github.actor == 'n33l4m1n' &&
      vars.AGENTS_ENABLED == 'true'
    runs-on: ubuntu-24.04
    environment: agent
    timeout-minutes: 45
    steps:
      - id: app
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.AGENT_APP_CLIENT_ID }}
          private-key: ${{ secrets.AGENT_APP_PRIVATE_KEY }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write
          permission-pull-requests: write
          permission-issues: write

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          token: ${{ steps.app.outputs.token }}
          fetch-depth: 0

      - name: Toolchain from rust-toolchain.toml
        run: rustup show active-toolchain || rustup toolchain install

      - id: claude
        uses: anthropics/claude-code-action@61a9c274fa7110a66dfafc1bbbced03833eb25fe # v1.0.269
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ steps.app.outputs.token }}
          label_trigger: agent:claude
          branch_prefix: agent/
          use_commit_signing: false
          bot_name: n33l4m1n-agent[bot]
          bot_id: "349171298"
          claude_args: >-
            --max-turns 40
            --allowedTools "Read,Edit,Write,Glob,Grep,Bash(cargo:*),Bash(make:*),Bash(git:*)"

      - name: Open the PR as n33l4m1n-agent
        if: always() && steps.claude.outputs.branch_name != ''
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          BRANCH: ${{ steps.claude.outputs.branch_name }}
          ISSUE: ${{ github.event.issue.number }}
          TITLE: ${{ github.event.issue.title }}
        run: |
          git fetch origin "$BRANCH" 2>/dev/null || { echo "branch $BRANCH was not pushed"; exit 0; }
          ahead=$(git rev-list --count "origin/main..origin/$BRANCH")
          [ "$ahead" -gt 0 ] || { echo "no commits on $BRANCH"; exit 0; }
          open=$(gh pr list --head "$BRANCH" --state open --json number --jq length)
          [ "$open" = 0 ] || { echo "PR already open for $BRANCH"; exit 0; }
          body=$(printf 'Closes #%s.\n\nImplemented by Claude in the agent loop; reviewed by Codex in `review-codex`. The owner merges.\n\n🤖 Generated with [Claude Code](https://claude.com/claude-code)' "$ISSUE")
          gh pr create --base main --head "$BRANCH" --title "$TITLE" --body "$body"
